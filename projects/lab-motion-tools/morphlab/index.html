<!doctype html>
<html><head><meta charset="utf-8">
<script src="../hf/assets/js/gsap.min.js"></script>
<script src="../hf/assets/js/MorphSVGPlugin.min.js"></script>
<style>
  body { margin:0; background:#111013; color:#EEE8E0; font:16px/1.3 monospace; }
  #grid { display:grid; grid-template-columns: 210px repeat(5, 170px); gap:6px; padding:24px; width:max-content; }
  .lab { display:flex; align-items:center; font-size:14px; letter-spacing:.06em; color:#EEE8E0; }
  .hd { text-align:center; color:#8b949e; font-size:13px; }
  .cell { background:#1b1a1f; width:170px; height:170px; }
  svg { width:170px; height:170px; }
  h2 { margin:18px 24px 0; font-size:15px; letter-spacing:.1em; color:#F2C841; }
</style></head>
<body>
<div id="out"></div><script src="paths.js"></script>
<script>
gsap.registerPlugin(MorphSVGPlugin);
const ts = [0, 0.25, 0.5, 0.75, 1];
// naive: resample both outlines to N points by arc length, lerp index-by-index (what hand-rolled morphs do)
function naive(a, b, t, N = 160) {
  const samp = d => { const p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d", d); const L = p.getTotalLength();
    return Array.from({ length: N }, (_, i) => { const q = p.getPointAtLength(L * i / N); return [q.x, q.y]; }); };
  const A = samp(a), B = samp(b);
  return "M" + A.map((q, i) => [(q[0] + (B[i][0] - q[0]) * t).toFixed(1), (q[1] + (B[i][1] - q[1]) * t).toFixed(1)].join(",")).join("L") + "Z";
}
function gsapMorph(a, b, t) {   // MorphSVG: shapeIndex auto + map by complexity, sampled at progress t
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d", a);
  const tw = gsap.to(p, { morphSVG: { shape: b, shapeIndex: "auto", map: "complexity" }, duration: 1, ease: "none", paused: true });
  tw.progress(t); const d = p.getAttribute("d"); tw.kill(); return d;
}
Promise.resolve(window.P).then(P => {
  let html = "";
  for (const [k, v] of Object.entries(P)) {
    html += `<h2>${k.replace("_", " → ").toUpperCase()}</h2><div id="grid"><div></div>` + ts.map(t => `<div class="hd">t = ${t}</div>`).join("");
    const rows = [["naive lerp (index)", ts.map(t => naive(v.a, v.b, t))], ["@remotion/paths interpolatePath", v.remotion], ["flubber (triangulate)", v.flubber], ["GSAP MorphSVG (auto)", ts.map(t => gsapMorph(v.a, v.b, t))]];
    for (const [name, ds] of rows) {
      html += `<div class="lab">${name}</div>` + ds.map(d => `<div class="cell"><svg viewBox="-20 -20 440 440"><path d="${d}" fill="#EA4032"/></svg></div>`).join("");
    }
    html += "</div>";
  }
  document.getElementById("out").innerHTML = html;
  window.READY = true;
});
</script>
</body></html>

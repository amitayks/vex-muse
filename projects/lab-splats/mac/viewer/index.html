<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Muse splat viewer (Spark 2.3.1)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 12px/1.35 ui-monospace, Menlo, monospace; color: #e8e8e8; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; outline: none; }
  #hud { position: absolute; left: 10px; top: 10px; padding: 8px 10px; background: rgba(0,0,0,.55); border-radius: 6px; white-space: pre; pointer-events: none; max-width: 46ch; }
  #hud.off { display: none; }
  #drop { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 22px; background: rgba(20,20,40,.7); border: 3px dashed #8ab; }
  #msg { position: absolute; right: 10px; bottom: 10px; padding: 6px 10px; background: rgba(0,0,0,.6); border-radius: 6px; white-space: pre; display: none; }
</style>
<script type="importmap">
{ "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/",
    "@sparkjsdev/spark": "./vendor/spark/spark.module.js"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="hud">loading…</div>
<div id="drop">drop a .ply / .spz / .splat / .ksplat / .sog file</div>
<div id="msg"></div>
<script type="module" src="./viewer.js"></script>
</body>
</html>
